<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>안성우 · 이력서 / 포트폴리오</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --line:#e5e5e5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --line:#2a2a2a; --accent:#60a5fa; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 32px; font-size:14px; }
  a.card { display:block; padding:18px 20px; border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--fg); margin-bottom:12px; }
  a.card:hover { border-color:var(--accent); }
  a.card strong { display:block; font-size:16px; margin-bottom:4px; }
  a.card span { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>안성우 · Product Engineer</h1>
  <p>브라우저에서 PDF로 바로 열립니다.</p>
  <a class="card" href="resume.pdf"><strong>이력서</strong><span>resume.pdf · 3p</span></a>
  <a class="card" href="portfolio.pdf"><strong>포트폴리오</strong><span>portfolio.pdf · 10MB</span></a>
</main>
</body>
</html>
